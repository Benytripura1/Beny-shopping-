<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENY SHOP</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f3f6}
header{background:#2874f0;color:white;padding:15px}
.logo{text-align:center;font-size:28px;font-weight:bold}
.search{width:100%;padding:12px;margin-top:12px;border:0;border-radius:5px}
nav{display:flex;justify-content:space-around;background:white;padding:14px}
nav a{color:#2874f0;text-decoration:none;font-weight:bold}
.banner{background:#2874f0;color:white;text-align:center;padding:35px 10px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;padding:12px;text-align:center;border-radius:8px}
.card img{width:100%;height:130px;object-fit:contain}
.price{color:green;font-weight:bold}
button{background:#fb641b;color:white;border:0;padding:10px;border-radius:5px;width:100%}
#cart{background:white;padding:15px;margin:12px;border-radius:8px}
</style>
</head>

<body>

<header>
<div class="logo">🛍️ BENY SHOP</div>
<input class="search" id="search" placeholder="Search products..." oninput="filterProducts()">
</header>

<nav>
<a href="#">Home</a>
<a href="#products">Products</a>
<a href="#cart">Cart 🛒</a>
</nav>

<div class="banner">
